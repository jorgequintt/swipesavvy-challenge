# Docker's embedded DNS. Containers get a new IP every time they're recreated
# (e.g. deploying a new green), so nginx must keep re-resolving the service name
# instead of using the IP it saw at startup.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream app {
    zone app 64k; # shared memory for the upstream; required by "resolve"
    # One line: "server app-blue:3000 resolve;" (or app-green). scripts/flip.sh rewrites it.
    include /etc/nginx/conf.d/active/upstream.conf;
    keepalive 16;
}

server {
    listen 80;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream $upstream_addr always;
    }
}